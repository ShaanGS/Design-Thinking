# Screenshots design-reference galleries for the deck and commits them under .github/refs/out (temporary).
name: Reference shots
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node .github/refs/shoot.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/refs/out
          git diff --cached --quiet || { git commit -m "Add reference screenshots"; git push; }
