# One-click deploy on Render (render.com → New → Blueprint → pick this repo).
services:
  - type: web
    name: saathi
    runtime: node
    rootDir: app
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SAATHI_MODEL
        value: claude-opus-5-5
      - key: DEMO_SPEED
        value: "20"
