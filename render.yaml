# One-click deploy on Render: https://render.com/deploy?repo=https://github.com/ShaanGS/Design-Thinking
services:
  - type: web
    name: saathi
    runtime: node
    rootDir: app
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "24"   # node:sqlite needs 22.13+ (unflagged)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SAATHI_MODEL
        value: claude-opus-5-5
      - key: DEMO_SPEED
        value: "20"
