<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Saathi Live Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+Tamil:wght@400;600&display=swap">
<style>
/* Audience takeover. The projector runs ?host; every phone in the room that scans the QR joins
   as "Paati's family" and reacts live to what the presenter triggers. */
:root{
  --bg:#EAF0ED; --surface:#FFFFFF; --surface-2:#F4F7F5; --ink:#13221E; --ink-2:#4B5D57; --line:#D3DDD8;
  --brand:#D98E04; --brand-soft:#FCEFD3; --brand-ink:#7A4E00;
  --sos:#D62839; --sos-soft:#FBE2E5; --ok:#12775A; --ok-soft:#DCF1E8; --warn:#AE5A06; --warn-soft:#FCEEDB; --info:#1E5E8A; --info-soft:#E0EDF6;
  --f-display:"Baloo Thambi 2","Noto Sans Tamil",ui-rounded,system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Noto Sans Tamil",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#16211E; --surface-2:#1C2925; --ink:#E4EDEA; --ink-2:#9BAFA8; --line:#2A3A35;
  --brand:#F0B13A; --brand-soft:#3A2C10; --brand-ink:#F6CD78; --sos:#FF5B6B; --sos-soft:#3B191E; --ok:#3CC594; --ok-soft:#12302A;
  --warn:#F0A04B; --warn-soft:#3A2A13; --info:#6AAEDF; --info-soft:#132A3B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#16211E; --surface-2:#1C2925; --ink:#E4EDEA; --ink-2:#9BAFA8; --line:#2A3A35;
  --brand:#F0B13A; --brand-soft:#3A2C10; --brand-ink:#F6CD78; --sos:#FF5B6B; --sos-soft:#3B191E; --ok:#3CC594; --ok-soft:#12302A;
  --warn:#F0A04B; --warn-soft:#3A2A13; --info:#6AAEDF; --info-soft:#132A3B; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 16px;font-weight:600}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sos{background:var(--sos);color:#fff;border-color:var(--sos)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.warn{background:var(--warn);color:#fff;border-color:var(--warn)}
.btn.big{width:100%;font-size:18px;padding:15px}
.conn{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink-2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--warn)}.dot.on{background:var(--ok)}.dot.off{background:var(--sos)}

/* Landing */
.landing{max-width:560px;margin:0 auto;padding-block:48px;display:flex;flex-direction:column;gap:16px}
.landing h1{font-size:40px}
.landing p{color:var(--ink-2);margin:0}
.codein{display:flex;gap:8px}
.codein input{flex:1;min-width:0;font:600 22px var(--f-mono);letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);color:var(--ink)}

/* Host */
.host{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;padding-block:20px 40px}
@media (max-width:1000px){.host{grid-template-columns:minmax(0,1fr)}}
.join{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:700px){.join{grid-template-columns:minmax(0,1fr)}}
#qr{background:#fff;padding:12px;border-radius:16px;width:max-content}
#qr img,#qr canvas{width:240px;height:240px;display:block}
.join h2{font-size:clamp(28px,4vw,46px)}
.join .code{font:600 clamp(36px,6vw,64px)/1 var(--f-mono);letter-spacing:.12em;color:var(--brand)}
.join .url{font:500 14px var(--f-mono);color:var(--ink-2);word-break:break-all}
.counter{display:flex;align-items:baseline;gap:12px;margin-top:6px}
.counter b{font:700 64px/1 var(--f-display);color:var(--ok)}
.wall{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;max-height:220px;overflow:hidden}
.person{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;animation:pop .35s ease-out}
.person small{color:var(--ink-2)}
.person.coming{background:var(--ok);color:#fff;border-color:var(--ok)}
.person.coming small{color:#fff;opacity:.85}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.controls{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:10px}
.controls h3{font-size:18px}
.controls .hint{font-size:13px;color:var(--ink-2)}
.resp{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.resp div{font-size:14px;padding:8px 10px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-weight:600}
.phase{font:600 13px var(--f-mono);padding:6px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}

/* Audience */
.aud{max-width:520px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:14px}
.ahead{display:flex;align-items:center;gap:12px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font:700 22px var(--f-display);flex:none}
.ahead h2{font-size:24px}
.ahead p{margin:0;color:var(--ink-2);font-size:14px}
.status{border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:6px;background:var(--ok-soft);color:var(--ok)}
.status h3{font-size:24px}
.status p{margin:0;color:var(--ink)}
.status.warn{background:var(--warn-soft);color:var(--warn)}
.feed{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;animation:slide .4s ease-out}
.item time{font:500 12px var(--f-mono);color:var(--ink-2)}
.item b{display:block}
@keyframes slide{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
.form{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px}
.form input{border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:var(--surface);color:var(--ink)}
.rels{display:flex;flex-wrap:wrap;gap:6px}
.rels button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 12px;font-size:14px}
.rels button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.takeover{position:fixed;inset:0;z-index:50;background:var(--sos);color:#fff;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:flash 1s ease-in-out infinite alternate}
@keyframes flash{from{background:#D62839}to{background:#A3132A}}
.takeover h2{font-size:clamp(34px,9vw,56px)}
.takeover p{margin:0;font-size:18px}
.takeover .facts{display:grid;gap:8px;background:rgba(0,0,0,.18);border-radius:16px;padding:14px}
.takeover .facts div{display:flex;justify-content:space-between;gap:12px;font-size:16px}
.takeover .facts span{opacity:.8}
.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;width:0;transition:width .5s linear}
.takeover .btn{border:0;font-size:18px;padding:16px}
.takeover .btn.w{background:#fff;color:#A3132A}
.takeover .btn.g{background:rgba(255,255,255,.18);color:#fff}
.takeover.calm{animation:none;background:var(--ok)}
.foot{color:var(--ink-2);font-size:12.5px;padding-block:10px 40px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="takeover" id="takeover" hidden></div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const params = new URLSearchParams(location.search);
const isHost = params.has("host") || location.hash === "#host";
const BROKERS = params.get("broker") ? [params.get("broker")] : ["wss://broker.hivemq.com:8884/mqtt", "wss://broker.emqx.io:8084/mqtt"];
const PREFIX = "saathi-dt/v1/";
const me = (() => { try { const k = "saathi-live-id"; let v = localStorage.getItem(k); if (!v) { v = Math.random().toString(36).slice(2, 10); localStorage.setItem(k, v); } return v; } catch (e) { return Math.random().toString(36).slice(2, 10); } })();
const clock = () => new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" });

/* ---------- Bus: MQTT over WebSockets, with a same-browser fallback for rehearsal ---------- */
function loadScript(src) { return new Promise(res => { const s = document.createElement("script"); s.src = src; s.onload = () => res(true); s.onerror = () => res(false); document.head.appendChild(s); }); }
const Bus = {
  client: null, subs: [], status: "connecting", onStatus: () => {}, bc: null,
  async connect() {
    if (!window.mqtt) await loadScript("vendor/mqtt.min.js");
    try { this.bc = new BroadcastChannel("saathi-live"); this.bc.onmessage = e => this.deliver(e.data.topic, e.data.msg); } catch (e) {}
    if (!window.mqtt) { this.set("local"); return; }
    for (const url of BROKERS) {
      const ok = await new Promise(res => {
        const c = window.mqtt.connect(url, { clientId: "saathi_" + me + "_" + Math.random().toString(36).slice(2, 6), connectTimeout: 6000, reconnectPeriod: 2000, clean: true });
        const t = setTimeout(() => { c.end(true); res(false); }, 7000);
        c.on("connect", () => { clearTimeout(t); this.client = c; res(true); });
        c.on("error", () => {});
      });
      if (ok) break;
    }
    if (!this.client) { this.set("local"); return; }
    this.client.on("message", (topic, buf) => { let msg; try { msg = JSON.parse(buf.toString()); } catch (e) { return; } this.deliver(topic, msg); });
    this.client.on("reconnect", () => this.set("connecting"));
    this.client.on("connect", () => { this.set("live"); this.subs.forEach(s => this.client.subscribe(s.topic, { qos: 1 })); });
    this.client.on("offline", () => this.set("offline"));
    this.subs.forEach(s => this.client.subscribe(s.topic, { qos: 1 }));
    this.set("live");
  },
  set(s) { this.status = s; this.onStatus(s); },
  sub(topic, cb) { this.subs.push({ topic, cb }); if (this.client) this.client.subscribe(topic, { qos: 1 }); },
  pub(topic, msg, retain) {
    if (this.client) this.client.publish(topic, JSON.stringify(msg), { qos: 1, retain: !!retain });
    try { this.bc && this.bc.postMessage({ topic, msg }); } catch (e) {}
    if (!this.client) this.deliver(topic, msg); // local echo
  },
  deliver(topic, msg) { this.subs.forEach(s => { if (match(s.topic, topic)) s.cb(msg, topic); }); },
};
function match(filter, topic) { const f = filter.split("/"), t = topic.split("/"); for (let i = 0; i < f.length; i++) { if (f[i] === "#") return true; if (f[i] !== "+" && f[i] !== t[i]) return false; } return f.length === t.length; }
function connBadge(id) { const el = $(id); if (!el) return; const s = Bus.status; el.innerHTML = `<span class="dot ${s === "live" ? "on" : s === "offline" ? "off" : ""}"></span>${s === "live" ? "Live" : s === "local" ? "Rehearsal mode (this browser only)" : s === "offline" ? "Reconnecting…" : "Connecting…"}`; }

/* ---------- Sound + vibration ---------- */
let audio = null;
function unlockAudio() { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {} }
function beep(freq, dur, when = 0, type = "sine", vol = .25) {
  if (!audio) return; const t = audio.currentTime + when, o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);
}
const chime = () => { beep(880, .25); beep(1320, .35, .18); };
const alarm = () => { for (let i = 0; i < 8; i++) { beep(960, .22, i * .5, "square", .18); beep(720, .22, i * .5 + .25, "square", .18); } };
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

/* ---------- Scenes the presenter can trigger ---------- */
const SCENES = {
  idle: { tone: "ok", title: "Amma is safe", body: "No alerts today." },
  morning: { tone: "ok", title: "Morning call done", body: "Amma took her tablets ✓ and enjoyed the temple yesterday. She slept poorly again (3rd night this week)." },
  missed: { tone: "warn", title: "Tablets not confirmed", body: "Saathi called Amma twice with no answer. Meena next door is going to check." },
  sos: { tone: "sos", title: "Amma pressed SOS", body: "Chest heaviness and sweating." },
  arrived: { tone: "ok", title: "Amma is with doctors", body: "Reached Saraswathi Multispeciality. The cath lab team was waiting. Karthik is with her." },
};

/* ============ HOST ============ */
function host() {
  const code = (params.get("room") || "").toUpperCase() || Array.from({ length: 4 }, () => "ABCDEFGHJKMNPQRSTUVWXYZ"[Math.floor(Math.random() * 23)]).join("");
  if (!params.get("room")) { try { history.replaceState(null, "", `?host&room=${code}${params.get("broker") ? "&broker=" + encodeURIComponent(params.get("broker")) : ""}`); } catch (e) {} }
  const base = location.href.split("?")[0].split("#")[0];
  const joinUrl = `${base}?room=${code}${params.get("broker") ? "&broker=" + encodeURIComponent(params.get("broker")) : ""}`;
  const T = PREFIX + code + "/";
  const people = new Map(), coming = [];
  let state = { v: 0, scene: "idle", t: Date.now() };
  $("#app").innerHTML = `<div class="wrap host">
    <div>
      <div class="join"><div id="qr"></div><div>
        <div class="conn" id="conn"></div>
        <h2>Scan to become Paati's family</h2>
        <div class="code">${code}</div>
        <div class="url">${esc(joinUrl)}</div>
        <div class="counter"><b id="count">0</b><span>family members in the room</span></div>
      </div></div>
      <div class="wall" id="wall"></div>
    </div>
    <div class="controls">
      <h3>Presenter controls</h3>
      <div class="phase">Now showing: <span id="phase">idle</span></div>
      <button class="btn ok big" data-scene="morning">1 · Morning call: all good</button>
      <button class="btn warn big" data-scene="missed">2 · Tablets not confirmed</button>
      <button class="btn sos big" data-scene="sos">3 · SOS: Amma needs help</button>
      <button class="btn solid big" data-scene="arrived">4 · Arrived at hospital</button>
      <button class="btn" data-scene="idle">Reset</button>
      <div class="hint">Everyone who scanned gets each update on their phone. On SOS their phones flash, buzz and ring, and they can tap "I'm on my way".</div>
      <h3 style="margin-top:6px">On the way</h3>
      <div class="resp" id="resp"><div style="background:var(--surface-2);color:var(--ink-2);font-weight:500">Nobody yet</div></div>
      <button class="btn" id="fake" title="Adds pretend phones for rehearsal">Rehearsal: add 8 pretend phones</button>
    </div>
  </div><div class="wrap foot">Saathi · Group 4 · demo room uses a public message broker, so share only sample data.</div>`;
  const qrBox = $("#qr");
  const drawQR = () => { if (window.QRCode) { try { new QRCode(qrBox, { text: joinUrl, width: 480, height: 480, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {} } else qrBox.textContent = "QR needs internet"; };
  if (window.QRCode) drawQR(); else loadScript("vendor/qrcode.min.js").then(drawQR);
  Bus.onStatus = () => connBadge("#conn"); connBadge("#conn");
  const renderWall = () => {
    $("#count").textContent = people.size;
    $("#wall").innerHTML = [...people.values()].slice(-60).map(p => `<span class="person ${coming.some(c => c.id === p.id) ? "coming" : ""}">${esc(p.name)} <small>${esc(p.rel)}</small></span>`).join("");
    $("#resp").innerHTML = coming.length ? coming.map(c => `<div>${esc(c.name)} (${esc(c.rel)}) · on the way · ${esc(c.at)}</div>`).join("") : `<div style="background:var(--surface-2);color:var(--ink-2);font-weight:500">Nobody yet</div>`;
  };
  const publish = scene => { state = { v: state.v + 1, scene, t: Date.now(), eta: 14, hospital: "Saraswathi Multispeciality", reason: "cath lab ready" }; Bus.pub(T + "state", state, true); $("#phase").textContent = scene; if (scene === "idle" || scene === "morning") { coming.length = 0; renderWall(); } };
  Bus.sub(T + "join", m => { if (!m || !m.id) return; people.set(m.id, { id: String(m.id).slice(0, 16), name: String(m.name || "Someone").slice(0, 24), rel: String(m.rel || "family").slice(0, 16) }); renderWall(); });
  Bus.sub(T + "resp", m => { if (!m || !m.id || coming.some(c => c.id === m.id)) return; const p = people.get(m.id) || { name: String(m.name || "Someone").slice(0, 24), rel: String(m.rel || "family").slice(0, 16) }; coming.push({ id: m.id, name: p.name, rel: p.rel, at: clock() }); renderWall(); });
  Bus.sub(T + "hello", () => Bus.pub(T + "state", state, true)); // late joiner asks for state (helps in rehearsal mode)
  document.querySelectorAll("[data-scene]").forEach(b => b.onclick = () => publish(b.dataset.scene));
  $("#fake").onclick = () => { const N = ["Ananya", "Rahul", "Divya", "Arjun", "Priya", "Vikram", "Meera", "Karan", "Sneha", "Aditya"], R = ["grandchild", "neighbour", "daughter", "son", "niece"]; for (let i = 0; i < 8; i++) { const id = "fake" + Math.random().toString(36).slice(2, 7); Bus.deliver(T + "join", { id, name: N[(Math.random() * N.length) | 0], rel: R[(Math.random() * R.length) | 0] }); } };
  Bus.connect().then(() => { connBadge("#conn"); publish("idle"); });
}

/* ============ AUDIENCE ============ */
function audience(code) {
  const T = PREFIX + code + "/";
  let profile = null, lastV = -1, feed = [], barTimer = 0, pending = null;
  try { profile = JSON.parse(sessionStorage.getItem("saathi-live-profile-" + code) || "null"); } catch (e) {}
  const renderJoin = () => {
    $("#app").innerHTML = `<div class="wrap aud">
      <div class="ahead"><div class="avatar">அ</div><div><h2>Join Paati's family</h2><p>Room ${esc(code)} · you'll get Saathi's alerts about Kamala Paati</p></div></div>
      <form class="form" id="jf"><label for="nm">Your first name</label><input id="nm" maxlength="20" autocomplete="given-name" placeholder="e.g. Divya" required>
        <div>How are you related?</div><div class="rels" id="rels">${["Son", "Daughter", "Grandchild", "Neighbour", "Doctor friend"].map((r, i) => `<button type="button" aria-pressed="${i === 2}" data-rel="${r}">${r}</button>`).join("")}</div>
        <button class="btn solid big" type="submit">Join and allow alerts</button>
        <div style="font-size:13px;color:var(--ink-2)">Turn your volume up. Your phone will ring and vibrate if Paati needs help.</div></form>
      <div class="conn" id="conn"></div></div>`;
    connBadge("#conn");
    $("#rels").onclick = e => { const b = e.target.closest("[data-rel]"); if (!b) return; document.querySelectorAll("[data-rel]").forEach(x => x.setAttribute("aria-pressed", x === b)); };
    $("#jf").onsubmit = e => {
      e.preventDefault(); unlockAudio(); chime(); buzz(60);
      profile = { id: me, name: $("#nm").value.trim().slice(0, 20) || "Someone", rel: (document.querySelector('[data-rel][aria-pressed="true"]') || {}).dataset?.rel || "Family" };
      try { sessionStorage.setItem("saathi-live-profile-" + code, JSON.stringify(profile)); } catch (x) {}
      Bus.pub(T + "join", profile); renderHome();
      if (pending) { const p = pending; pending = null; onState(p); }
    };
  };
  const renderHome = () => {
    $("#app").innerHTML = `<div class="wrap aud">
      <div class="ahead"><div class="avatar">அ</div><div><h2>Amma · Kamala Paati</h2><p>You're in as ${esc(profile.name)} (${esc(profile.rel)})</p></div></div>
      <div class="status" id="st"><h3>Amma is safe</h3><p>Saathi calls her every morning at 9. You'll see updates here.</p></div>
      <div class="feed" id="feed"></div><div class="conn" id="conn"></div></div>`;
    connBadge("#conn"); renderFeed();
    if (!audio) { const tap = () => { unlockAudio(); document.removeEventListener("pointerdown", tap); }; document.addEventListener("pointerdown", tap); }
  };
  const renderFeed = () => { const f = $("#feed"); if (f) f.innerHTML = feed.map(i => `<div class="item"><time>${esc(i.at)}</time><b>${esc(i.title)}</b>${esc(i.body)}</div>`).join(""); };
  const onState = s => {
    if (!s || typeof s.v !== "number" || s.v === lastV) return;
    if (!profile) { pending = s; return; }
    const first = lastV === -1; lastV = s.v;
    const sc = SCENES[s.scene] || SCENES.idle;
    const tk = $("#takeover");
    if (s.scene === "idle") { feed = []; tk.hidden = true; if (profile) renderHome(); return; }
    if (!first || s.scene !== "sos") feed.unshift({ at: clock(), title: sc.title, body: sc.body });
    renderFeed();
    const st = $("#st");
    if (st) { st.className = "status" + (sc.tone === "warn" ? " warn" : ""); st.innerHTML = `<h3>${esc(sc.title)}</h3><p>${esc(sc.body)}</p>`; }
    clearInterval(barTimer);
    if (s.scene === "sos") {
      tk.className = "takeover"; tk.hidden = false;
      tk.innerHTML = `<div class="mono" style="opacity:.85">SAATHI EMERGENCY · ${esc(clock())}</div><h2>Amma pressed SOS</h2>
        <p>Chest heaviness and sweating. Saathi has already called 108 and Meena next door.</p>
        <div class="facts"><div><span>Ambulance to</span><b>${esc(s.hospital || "Saraswathi")}</b></div><div><span>Why there</span><b>${esc(s.reason || "cath lab ready")}</b></div><div><span>ETA</span><b class="mono" id="eta">${esc(s.eta || 14)} min</b></div><div><span>Her records</span><b>Sent to ER ✓</b></div></div>
        <div class="bar"><i id="bar"></i></div>
        <button class="btn w" id="omw">I'm on my way</button><button class="btn g" id="callA">Call Amma</button>`;
      if (!first) { buzz([600, 200, 600, 200, 900, 300, 900]); alarm(); }
      const start = Date.now(), eta = +s.eta || 14;
      barTimer = setInterval(() => { const p = Math.min(1, (Date.now() - start) / 30000); const b = $("#bar"); if (b) b.style.width = (p * 100).toFixed(1) + "%"; const e = $("#eta"); if (e) e.textContent = Math.max(0, Math.ceil(eta * (1 - p))) + " min"; }, 500);
      $("#omw").onclick = () => { Bus.pub(T + "resp", { ...profile, at: Date.now() }); $("#omw").textContent = "Karthik and the hospital know you're coming ✓"; $("#omw").disabled = true; buzz(60); };
      $("#callA").onclick = () => { $("#callA").textContent = "Calling Amma… (demo)"; };
    } else if (s.scene === "arrived") {
      tk.className = "takeover calm"; tk.hidden = false;
      tk.innerHTML = `<div class="mono" style="opacity:.85">SAATHI · ${esc(clock())}</div><h2>Amma is with doctors</h2><p>${esc(sc.body)}</p><p style="opacity:.9">Saathi will send you an update after the procedure.</p><button class="btn w" id="closeT">OK</button>`;
      if (!first) { chime(); buzz([80, 60, 80]); }
      $("#closeT").onclick = () => tk.hidden = true;
    } else {
      tk.hidden = true;
      if (!first) { chime(); buzz(sc.tone === "warn" ? [200, 100, 200] : 80); }
    }
  };
  Bus.onStatus = () => connBadge("#conn");
  Bus.sub(T + "state", onState);
  if (profile) renderHome(); else renderJoin();
  Bus.connect().then(() => { connBadge("#conn"); Bus.pub(T + "hello", { id: me }); if (profile) Bus.pub(T + "join", profile); });
}

/* ============ LANDING ============ */
function landing() {
  $("#app").innerHTML = `<div class="wrap landing">
    <h1>Saathi Live Room</h1>
    <p>Turn the whole audience into Paati's family. The presenter opens the host screen on the projector; everyone else scans the QR code.</p>
    <a class="btn solid big" style="text-align:center;text-decoration:none" href="?host">I'm presenting: open host screen</a>
    <form class="codein" id="cf"><input id="code" maxlength="4" placeholder="CODE" aria-label="Room code"><button class="btn">Join</button></form>
  </div>`;
  $("#cf").onsubmit = e => { e.preventDefault(); const c = $("#code").value.trim().toUpperCase(); if (c) location.search = "?room=" + encodeURIComponent(c); };
}

if (isHost) host();
else if (params.get("room")) audience(params.get("room").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8));
else landing();
})();
</script>
