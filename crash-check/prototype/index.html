<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
</head>
<body>
<title>Crash Check</title>
<style>
/* Ride Nanba's own system (ride-nanba/docs/DESIGN.md, app/globals.css): Uber light. White page,
   #f3f3f3 tiles, black text and buttons. Colour comes from the 3D art and from meaning only:
   green for live and safe, red for a crash, purple for the safety shield.
   Layout: on a wide screen, two phones side by side (Priya riding, Amma at home); on a phone,
   the one phone this device is playing. */
:root {
  --bg: #ffffff;
  --surface: #f3f3f3;
  --surface-2: #e8e8e8;
  --line: rgb(0 0 0 / 0.08);
  --text: #000000;
  --muted: #5e5e5e;
  --faint: #6f6f6f;
  --flood: #c0341d;
  --flood-soft: rgb(192 52 29 / 0.12);
  --ok: #0a7d44;
  --ok-soft: rgb(10 125 68 / 0.13);
  --safe: #5b3fd6;
  --stage: #e9e9e9;
  --map: #f1f1ef;
  --map-road: #ffffff;
  --map-green: #e3ece0;
  --rider: #276ef1;
  --shadow: rgb(0 0 0 / 0.14);
  --font: system-ui, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--stage);
  color: var(--text);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 8px; }
.tn { font-variant-numeric: tabular-nums; }

/* Stage */
.stage { height: 100%; display: flex; justify-content: center; align-items: stretch; gap: 48px; }
.phone-col { display: flex; flex-direction: column; align-items: center; gap: 14px; height: 100%; width: 100%; max-width: 430px; }
.phone-cap { display: none; text-align: center; }
.phone-cap b { display: block; font-size: 1rem; }
.phone-cap span { font-size: 0.875rem; color: var(--muted); }
.screen { position: relative; width: 100%; height: 100%; background: var(--bg); overflow: hidden; isolation: isolate; }
.scroll { height: 100%; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.stage[data-only="rider"] .phone-col[data-role="guardian"],
.stage[data-only="guardian"] .phone-col[data-role="rider"] { display: none; }

@media (min-width: 640px) and (min-height: 640px) {
  .stage { align-items: center; padding-block: 20px; }
  .phone-col { width: auto; height: auto; }
  .screen {
    width: 390px; height: min(844px, calc(100dvh - 90px)); border-radius: 46px;
    box-shadow: 0 0 0 10px #111111, 0 0 0 11px #2c2c31, 0 40px 80px rgb(0 0 0 / 0.25);
  }
  .phone-cap { display: block; }
}
@media (min-width: 940px) and (min-height: 640px) {
  .stage[data-only] .phone-col { display: flex !important; }
}

/* Type, Ride Nanba scale: 12 14 16 18 at 400/500, headings 20 24 28 32 at 700 */
.t-xs { font-size: 0.75rem; }
.t-sm { font-size: 0.875rem; }
.t-base { font-size: 1rem; }
.t-lg { font-size: 1.125rem; }
.h-20 { font-size: 1.25rem; font-weight: 700; }
.h-24 { font-size: 1.5rem; font-weight: 700; }
.h-28 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.01em; }
.h-32 { font-size: 2rem; font-weight: 700; letter-spacing: -0.015em; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.med { font-weight: 500; }
h1, h2, h3, p { margin: 0; text-wrap: balance; }
p { text-wrap: pretty; }

.pad { padding-inline: 16px; }
.page-top { padding: max(env(safe-area-inset-top, 0px), 20px) 16px 0; }
.stack { display: flex; flex-direction: column; }
.gap-1 { gap: 4px; } .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; }
.mt-1 { margin-top: 4px; } .mt-2 { margin-top: 8px; } .mt-3 { margin-top: 12px; } .mt-4 { margin-top: 16px; } .mt-6 { margin-top: 24px; } .mt-8 { margin-top: 32px; }
.center { text-align: center; }
.ic { width: 20px; height: 20px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ic-24 { width: 24px; height: 24px; }

/* Buttons */
.btn { display: inline-flex; min-height: 56px; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; padding: 0 20px; font-size: 1.0625rem; font-weight: 600; transition: transform 120ms ease; width: 100%; text-align: center; }
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--text); color: var(--bg); }
.btn-soft { background: var(--surface-2); color: var(--text); }
.btn-danger { background: var(--flood); color: #ffffff; }
.btn[disabled] { opacity: 0.45; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.chip { min-height: 40px; border-radius: 999px; padding: 0 16px; font-size: 0.875rem; font-weight: 500; background: var(--surface); flex-shrink: 0; }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.round { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; background: var(--bg); box-shadow: 0 2px 8px var(--shadow); flex-shrink: 0; }
.round-flat { box-shadow: none; background: var(--surface-2); }
.tag { display: inline-flex; height: 24px; align-items: center; gap: 6px; border-radius: 999px; padding: 0 10px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
.tag-ok { background: var(--ok-soft); color: var(--ok); }
.tag-flood { background: var(--flood-soft); color: var(--flood); }
.tag-neutral { background: var(--surface-2); color: var(--muted); }
.tag-best { background: var(--text); color: var(--bg); }
.dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; }
.link { text-decoration: underline; text-underline-offset: 4px; font-weight: 500; }

/* Rows */
.row { display: flex; min-height: 64px; width: 100%; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); padding-block: 12px; text-align: left; }
.row:last-child { border-bottom: 0; }
.row-ic { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 999px; background: var(--surface); flex-shrink: 0; }
.row-body { min-width: 0; flex: 1; }
.row-title { display: block; font-size: 1rem; font-weight: 500; }
.row-sub { display: block; font-size: 0.875rem; color: var(--muted); }
.chev { color: var(--faint); }
.art { flex-shrink: 0; object-fit: contain; pointer-events: none; user-select: none; }

.tile { background: var(--surface); border-radius: 12px; padding: 16px; }
.banner { width: 100%; height: 128px; object-fit: cover; object-position: 50% 70%; border-radius: 12px; display: block; }
.hair { border: 0; border-top: 1px solid var(--line); margin: 0; }

/* Switch, exactly Ride Nanba's SwitchTrack */
.track { display: flex; width: 52px; height: 32px; border-radius: 999px; padding: 2px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); flex-shrink: 0; transition: background-color 160ms; }
.track span { width: 28px; height: 28px; border-radius: 999px; background: var(--bg); transition: transform 160ms; }
[aria-checked="true"] .track { background: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
[aria-checked="true"] .track span { transform: translateX(20px); }

/* Map screen: map on top, sheet over it, one pinned button */
.mapscreen { position: relative; display: flex; min-height: 100%; flex-direction: column; }
.mapbox { position: sticky; top: 0; z-index: 0; height: 290px; background: var(--map); }
.mapbox svg { display: block; width: 100%; height: 100%; }
.map-btn { position: absolute; top: max(env(safe-area-inset-top, 0px), 14px); z-index: 2; }
.sheet-body { position: relative; z-index: 1; margin-top: -16px; flex: 1; border-radius: 16px 16px 0 0; background: var(--bg); padding-bottom: 16px; box-shadow: 0 -4px 16px rgb(0 0 0 / 0.08); }
.grab { display: block; margin: 8px auto 0; width: 40px; height: 4px; border-radius: 999px; background: var(--surface-2); }
.sheet-title { margin-top: 12px; border-bottom: 1px solid var(--line); padding-bottom: 12px; text-align: center; font-size: 1.25rem; font-weight: 700; }
.footer { position: sticky; bottom: 0; z-index: 3; border-top: 1px solid var(--line); background: var(--bg); padding: 12px 16px max(env(safe-area-inset-bottom, 0px), 12px); }
.progress { display: flex; gap: 4px; }
.progress i { height: 4px; border-radius: 999px; background: var(--surface-2); }
.progress i.on { background: var(--text); }

/* Live g readout in the Crash Check row */
.gread { display: inline-flex; align-items: center; gap: 6px; font-size: 0.875rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.pulse { width: 8px; height: 8px; border-radius: 999px; background: var(--ok); }
.checking .pulse { background: var(--text); }
.checkbar { height: 2px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-top: 8px; }
.checkbar i { display: block; height: 100%; width: 0; background: var(--text); }

/* Bottom sheet (vaul in Ride Nanba) */
.overlay { position: absolute; inset: 0; z-index: 40; background: rgb(0 0 0 / 0.4); }
.bsheet { position: absolute; inset: auto 0 0 0; z-index: 50; max-height: 88%; display: flex; flex-direction: column; border-radius: 24px 24px 0 0; background: var(--bg); animation: up 260ms cubic-bezier(0.16, 1, 0.3, 1); }
.bsheet .scroll { padding: 12px 16px max(env(safe-area-inset-bottom, 0px), 24px); height: auto; }
@keyframes up { from { transform: translateY(40px); opacity: 0.6; } to { transform: none; opacity: 1; } }

/* Full-screen takeover */
.takeover { position: absolute; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; }
.takeover .scroll { flex: 1; }
.ring { position: relative; width: 208px; height: 208px; margin: 0 auto; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring .num b { display: block; font-size: 4.5rem; font-weight: 700; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.ring .num span { font-size: 0.875rem; color: var(--muted); }

.toast { position: absolute; left: 16px; right: 16px; bottom: 96px; z-index: 70; background: var(--text); color: var(--bg); border-radius: 12px; padding: 14px 16px; font-size: 0.9375rem; font-weight: 500; box-shadow: 0 8px 24px rgb(0 0 0 / 0.2); animation: up 220ms ease; }

/* Chart */
.chart { width: 100%; height: 170px; display: block; }
table.signals { width: 100%; border-collapse: collapse; font-size: 1rem; }
.signals th { padding-bottom: 8px; font-size: 0.75rem; font-weight: 400; color: var(--muted); text-align: left; }
.signals th:last-child, .signals td:last-child { text-align: right; }
.signals td { border-top: 1px solid var(--line); padding: 11px 0; font-variant-numeric: tabular-nums; }
.signals td:nth-child(2) { color: var(--muted); font-size: 0.875rem; }
.signals tr.off td:first-child { color: var(--faint); }
.signals tr.total td { font-weight: 700; border-top: 2px solid var(--text); }
.pts-neg { color: var(--flood); }

.avatar { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 999px; background: var(--text); color: var(--bg); font-size: 1.75rem; font-weight: 700; flex-shrink: 0; }
.medid { border-radius: 16px; background: var(--surface); padding: 4px 16px; }
.medid .row { min-height: 52px; }

@media (prefers-reduced-motion: reduce) {
  .bsheet, .toast { animation: none; }
  .btn { transition: none; }
}
</style>

<div class="stage" id="stage">
  <div class="phone-col" data-role="rider">
    <div class="phone-cap"><b>Priya's phone</b><span>Riding her scooter to Tambaram</span></div>
    <div class="screen" id="rider"></div>
  </div>
  <div class="phone-col" data-role="guardian">
    <div class="phone-cap"><b>Amma's phone</b><span>At home in Anna Nagar</span></div>
    <div class="screen" id="guardian"></div>
  </div>
</div>

<script>/*
 * Crash Check: the detection model.
 *
 * Runs on the phone, on the motion sensor stream. Nothing here touches the network.
 *
 * The question it answers: "did this phone just go through a crash, or was it dropped?"
 * A single g-force threshold cannot answer that. A phone dropped on tiles from 1.2 m can
 * spike past 6 g, more than many bike crashes register on a phone in a pocket. What
 * separates the two is the story around the spike:
 *
 *   1. Were you moving at riding speed just before?      (GPS, or the trip you are on)
 *   2. How hard was the hit, and how long did it last?   (accelerometer, in g)
 *   3. Did the phone tumble?                             (gyroscope, degrees turned)
 *   4. Did you stop dead afterwards?                     (GPS speed after)
 *   5. Is the phone lying still, or was it picked up?    (motion after, screen touch)
 *
 * Each signal adds or takes away points. The total decides what happens next:
 *   >= 60  crash: ask "Are you okay?" with a countdown, then alert family
 *   35-59  fall:  a quiet check, nothing is sent unless you ask for help
 *   < 35   nothing is sent (a drop, a bump, a toss on the bed)
 *
 * Units: time in ms, acceleration in g (1 g = 9.81 m/s^2, includes gravity, so a phone at
 * rest reads 1 g and a phone in free fall reads close to 0 g), rotation in degrees/second,
 * speed in km/h.
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === "object" && module.exports) module.exports = api;
  else root.CrashModel = api;
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  const G = 9.80665;

  /** Tunable constants. Every number has a reason next to it. */
  const T = {
    triggerG: 2.5, // A hit this hard starts a check. Walking peaks near 1.6 g, braking near 1.3 g.
    freeFallG: 0.4, // Below this the phone is falling (it reads 0 g in true free fall).
    freeFallTriggerMs: 150, // 150 ms of falling is a drop of about 11 cm. Shorter is a jolt.
    hitG: 2.0, // Time spent above 2 g measures how long the hit lasted.
    settleMs: 6000, // Watch for 6 s after the hit before deciding.
    stillG: 0.12, // Within 0.12 g of 1 g, and turning under 25 deg/s, counts as lying still.
    stillRot: 25,
    pickupRot: 70, // Turning faster than 70 deg/s after the hit, or a 0.25 g jolt, is handling.
    pickupG: 0.25,
    ridingKmh: 12, // A cycle or a slow bike in traffic.
    movingKmh: 5, // Faster than walking.
    stoppedKmh: 3,
    askAt: 60,
    quietAt: 35,
    cooldownMs: 4000,
    bufferMs: 12000,
  };

  /** Points for each signal, with the label a rider reads in the app. */
  function scoreFeatures(f) {
    const s = [];
    const add = (key, label, value, points, met) => s.push({ key, label, value, points: met ? points : 0, met });

    const before = f.speedBefore;
    add("moving", "Moving before", before == null ? "Not known" : `${Math.round(before)} km/h`, before >= T.ridingKmh ? 30 : 10, before != null && before >= T.movingKmh);

    const peakPts = f.peakG >= 4 ? 20 : 10;
    add("impact", "Hit", `${f.peakG.toFixed(1)} g`, peakPts, f.peakG >= T.triggerG);

    add("lasted", "Hit lasted", `${Math.round(f.hitMs)} ms above 2 g`, 10, f.hitMs >= 60);

    add("tumble", "Tumbled", `${Math.round(f.rotationDeg)} degrees`, 15, f.rotationDeg >= 270);

    const stoppedDead =
      before != null && before >= T.movingKmh && (f.speedAfter != null ? f.speedAfter < T.stoppedKmh : f.stillMs >= 3000);
    add(
      "stopped",
      "Stopped dead",
      f.speedAfter != null ? `${Math.round(f.speedAfter)} km/h after` : f.stillMs >= 3000 ? "No movement after" : "Still moving",
      15,
      stoppedDead,
    );

    add("still", "Lying still", `${(f.stillMs / 1000).toFixed(1)} s`, 10, f.stillMs >= 3000 && !f.pickedUp);

    // Signals that take points away.
    if (f.pickedUp) s.push({ key: "picked", label: "Picked up", value: f.touched ? "Screen touched" : "Handled after the hit", points: -40, met: true });
    if (f.speedAfter != null && f.speedAfter >= 10)
      s.push({ key: "resumed", label: "Kept going", value: `${Math.round(f.speedAfter)} km/h after`, points: -50, met: true });

    const score = Math.max(0, Math.min(100, s.reduce((n, x) => n + x.points, 0)));
    return { score, signals: s };
  }

  function verdictFor(score, f) {
    if (score >= T.askAt) return "crash";
    const wasMoving = f.speedBefore != null && f.speedBefore >= T.movingKmh;
    if (score >= T.quietAt && wasMoving) return "fall";
    if (f.speedAfter != null && f.speedAfter >= 10) return "bump";
    if (f.freeFallMs >= 200) return "drop";
    return "nothing";
  }

  const WORDS = {
    crash: "Looks like a crash. Asking if you are okay.",
    fall: "Looks like a fall. A quiet check, nothing sent.",
    bump: "A bump on the road. You kept going.",
    drop: "Looks like a dropped phone. Nothing sent.",
    nothing: "Nothing to worry about. Nothing sent.",
  };

  /** Longest run of consecutive samples where test() holds, in ms. */
  function longestRun(samples, test) {
    let best = 0;
    let start = null;
    for (let i = 0; i < samples.length; i++) {
      const s = samples[i];
      if (test(s)) {
        if (start == null) start = s.t;
        best = Math.max(best, s.t - start + (samples[i + 1] ? samples[i + 1].t - s.t : 0));
      } else start = null;
    }
    return best;
  }

  /** The run that is still going at the end of the window, in ms. */
  function trailingRun(samples, test) {
    let end = samples.length - 1;
    if (end < 0 || !test(samples[end])) return 0;
    let i = end;
    while (i > 0 && test(samples[i - 1])) i--;
    return samples[end].t - samples[i].t;
  }

  /** Work out the five signals around a hit at time t0. */
  function extract(buffer, speeds, t0, tEnd, touchedAt) {
    const win = (a, b) => buffer.filter((s) => s.t >= a && s.t <= b);
    const hitWin = win(t0 - 500, t0 + 1500);
    const fallWin = win(t0 - 1500, t0 + 500);
    const rotWin = win(t0 - 500, t0 + 2000);
    const afterWin = win(t0 + 1500, tEnd);

    const peakG = hitWin.reduce((m, s) => Math.max(m, s.g), 0);
    let hitMs = 0;
    for (let i = 1; i < hitWin.length; i++) if (hitWin[i].g >= T.hitG) hitMs += hitWin[i].t - hitWin[i - 1].t;
    const freeFallMs = longestRun(fallWin, (s) => s.g < T.freeFallG);
    let rotationDeg = 0;
    for (let i = 1; i < rotWin.length; i++) rotationDeg += (rotWin[i].rot * (rotWin[i].t - rotWin[i - 1].t)) / 1000;

    const isStill = (s) => Math.abs(s.g - 1) < T.stillG && s.rot < T.stillRot;
    const stillMs = trailingRun(afterWin, isStill);
    let handledMs = 0;
    for (let i = 1; i < afterWin.length; i++) {
      const s = afterWin[i];
      if (s.rot > T.pickupRot || Math.abs(s.g - 1) > T.pickupG) handledMs += s.t - afterWin[i - 1].t;
    }
    const touched = touchedAt != null && touchedAt > t0 && touchedAt <= tEnd;
    const pickedUp = touched || (handledMs >= 300 && stillMs < 2000);

    const before = speeds.filter((v) => v.t >= t0 - 8000 && v.t <= t0 - 200);
    const after = speeds.filter((v) => v.t >= t0 + 2000 && v.t <= tEnd);
    const speedBefore = before.length ? Math.max(...before.map((v) => v.kmh)) : null;
    const speedAfter = after.length ? after[after.length - 1].kmh : null;

    return { peakG, hitMs, freeFallMs, rotationDeg, stillMs, pickedUp, touched, speedBefore, speedAfter };
  }

  /**
   * The streaming detector. Feed it motion samples and speed readings as they arrive; it
   * calls onDecision once per event, about 6 s after the hit.
   */
  function createDetector(opts = {}) {
    const onDecision = opts.onDecision || (() => {});
    const onTrigger = opts.onTrigger || (() => {});
    let buffer = [];
    let speeds = [];
    let pending = null; // { t0 }
    let cooldownUntil = 0;
    let touchedAt = null;
    let ffStart = null;

    function prune(now) {
      const cut = now - T.bufferMs;
      if (buffer.length && buffer[0].t < cut) buffer = buffer.filter((s) => s.t >= cut);
      if (speeds.length && speeds[0].t < cut) speeds = speeds.filter((s) => s.t >= cut);
    }

    function decide(now) {
      const t0 = pending.t0;
      const f = extract(buffer, speeds, t0, now, touchedAt);
      const { score, signals } = scoreFeatures(f);
      const verdict = verdictFor(score, f);
      pending = null;
      cooldownUntil = now + T.cooldownMs;
      onDecision({ t0, at: now, score, verdict, words: WORDS[verdict], signals, features: f });
    }

    return {
      /** sample: { t, g } plus optional rot (deg/s). Or pass ax, ay, az in g. */
      push(sample) {
        const s = { t: sample.t, g: sample.g, rot: sample.rot || 0 };
        if (s.g == null) s.g = Math.hypot(sample.ax || 0, sample.ay || 0, sample.az || 0);
        buffer.push(s);
        prune(s.t);

        if (s.g < T.freeFallG) {
          if (ffStart == null) ffStart = s.t;
        } else ffStart = null;

        if (!pending && s.t >= cooldownUntil) {
          const falling = ffStart != null && s.t - ffStart >= T.freeFallTriggerMs;
          if (s.g >= T.triggerG || falling) {
            // Anchor the window on the hit itself, which comes right after a fall.
            pending = { t0: s.t };
            onTrigger({ t: s.t, g: s.g, reason: falling ? "fall" : "hit" });
          }
        } else if (pending && s.g >= T.triggerG && s.t - pending.t0 < 1200) {
          // A fall that ends in a hit: move the anchor onto the hit.
          const peakSoFar = buffer.filter((x) => x.t >= pending.t0 - 50 && x.t < s.t).reduce((m, x) => Math.max(m, x.g), 0);
          if (s.g > peakSoFar && peakSoFar < T.triggerG) pending.t0 = s.t;
        }
        if (pending && s.t - pending.t0 >= T.settleMs) decide(s.t);
      },
      speed(t, kmh) {
        speeds.push({ t, kmh });
        prune(t);
      },
      touch(t) {
        touchedAt = t;
      },
      busy() {
        return pending != null;
      },
      reset() {
        buffer = [];
        speeds = [];
        pending = null;
        cooldownUntil = 0;

/* ---------- sound, voice, buzz: all optional ---------- */
let audio = null;
function unlockAudio() {
  if (audio) return;
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch { audio = null; }
}
document.addEventListener("pointerdown", unlockAudio, { capture: true });
function beep(freqs, ms = 160, vol = 0.18) {
  if (!audio) return;
  try {
    let t = audio.currentTime;
    for (const f of freqs) {
      const o = audio.createOscillator(); const g = audio.createGain();
      o.type = "square"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
      o.connect(g).connect(audio.destination); o.start(t); o.stop(t + ms / 1000 + 0.02);
      t += ms / 1000 + 0.05;
    }
  } catch {}
}
function say(text) {
  try { const u = new SpeechSynthesisUtterance(text); u.rate = 0.95; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch {}
}
function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch {} }

/* ---------- messages between the two phones ---------- */
const ME = Math.random().toString(36).slice(2, 10);
let room = null;
let bc = null;
try { bc = new BroadcastChannel("crash-check"); bc.onmessage = (e) => deliver(e.data); } catch {}
function send(msg) {
  msg = { ...msg, from: ME };
  deliver(msg);
  try { bc && bc.postMessage(msg); } catch {}
  if (room) room.emit("cc", msg).catch(() => {});
}
function deliver(msg) {
  if (!msg || typeof msg !== "object") return;
  if (msg.to === "guardian") guardianHear(msg);
  else if (msg.to === "rider") riderHear(msg);
}
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    room = await window.claude.use("room");
    if (!room) return;
    room.on("cc", (m) => { if (!m.sameTab && m.data && m.data.from !== ME) deliver(m.data); });
    room.onPeers(() => { R.peers = room.peers().filter((p) => !p.sameTab).length; if (R.sheet === "presenter") renderRider(); });
  } catch { room = null; }
})();

/* ================= RIDER: Priya ================= */
const R = {
  screen: "ride", // ride | decides | settings
  takeover: null, // ask | sent
  sheet: null, // presenter | fall | medical
  toast: null,
  moving: true,
  checking: null, // model time of the hit
  last: null,
  checks: [],
  log: store.get("log", []),
  set: Object.assign({ on: true, tripsOnly: true, wait: 30, stage: false }, store.get("settings", {})),
  sensor: "off", // off | on | none
  gps: null, // { kmh, lat, lng }
  playing: null,
  progress: 0.34,
  ask: null, // { left, total, startedAt }
  alert: null,
  people: [
    { id: "amma", name: "Amma", rel: "Mother", status: "Not sent" },
    { id: "arjun", name: "Arjun", rel: "Friend from SRM", status: "Not sent" },
  ],
  peers: 0,
  startedAt: new Date(Date.now() - 16 * 60000),
};
const rider = document.getElementById("rider");

const detector = M.createDetector({
  onTrigger: (e) => { R.checking = e.t; updateLive(true); },
  onDecision: (d) => decided(d),
});

/* model clock: every sample carries model time in ms */
let mt = 0;
let lastWall = performance.now();
const trace = []; // { t, g }
let lastG = 1;
function feed(s) {
  detector.push(s);
  trace.push({ t: s.t, g: s.g });
  while (trace.length && trace[0].t < s.t - 10000) trace.shift();
  lastG = s.g;
}

/* idle motion: a phone in a pocket on a scooter, or at a signal */
const rnd = () => Math.random() - 0.5;
let lastSpeedAt = -1e9;
setInterval(() => {
  const now = performance.now();
  if (R.playing) { playTick(now); lastWall = now; return; }
  if (R.sensor !== "on") {
    mt += 20;
    const still = R.takeover === "sent" || R.takeover === "ask";
    const g = still ? 1 + rnd() * 0.02 : R.moving ? 1 + rnd() * 0.22 : 1 + rnd() * 0.08;
    feed({ t: mt, g, rot: still ? 1 : R.moving ? 14 + Math.random() * 18 : 8 });
  }
  if (mt - lastSpeedAt >= 1000) {
    lastSpeedAt = mt;
    if (!detector.busy() && !R.takeover) detector.speed(mt, currentKmh());
    if (R.moving && !R.takeover) R.progress = Math.min(0.92, R.progress + 0.0006);
  }
  lastWall = now;
}, 20);
// GPS speed wins when it shows real movement (out on the road). Indoors, on stage, GPS reads
// about 0, so the presenter's setting decides.
function currentKmh() {
  if (R.gps && R.gps.kmh != null && R.gps.kmh > 3) return R.gps.kmh;
  return R.moving ? 30 + Math.random() * 4 : 0;
}

/* real sensors, outside the claude.ai frame */
let motionSeen = false;
let lastMotionAt = null; // wall time of the previous sensor reading
function onMotion(e) {
  if (R.playing) { lastMotionAt = null; return; }
  const now = performance.now();
  // Model time moves by the real gap since the previous reading (phones send 16 to 100 per second).
  mt += lastMotionAt == null ? 20 : Math.max(1, Math.min(100, now - lastMotionAt));
  lastMotionAt = now;
  const s = M.fromDeviceMotion(e, mt);
  if (!s) return;
  motionSeen = true;
  feed(s);
}
async function startSensor() {
  try {
    if (typeof DeviceMotionEvent === "undefined") throw new Error("none");
    // iPhones, and newer Chrome, ask first. Some browsers answer "prompt" or "denied" and then
    // send readings anyway, so what decides is whether readings arrive, checked below.
    if (typeof DeviceMotionEvent.requestPermission === "function") {
      try { await DeviceMotionEvent.requestPermission(); } catch {}
    }
    window.addEventListener("devicemotion", onMotion);
    R.sensor = "on";
    try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch {}
    try {
      navigator.geolocation.watchPosition(
        (p) => { R.gps = { kmh: p.coords.speed == null ? null : p.coords.speed * 3.6, lat: p.coords.latitude, lng: p.coords.longitude }; },
        () => {}, { enableHighAccuracy: true, maximumAge: 1000 });
    } catch {}
    setTimeout(() => { if (!motionSeen) { R.sensor = "none"; window.removeEventListener("devicemotion", onMotion); renderRider(); } }, 2500);
  } catch { R.sensor = "none"; }
  renderRider();
}

/* playing a recorded moment through the live pipeline, at double speed */
const SPEEDUP = 2;
function play(id) {
  const tr = S.all().find((x) => x.id === id);
  if (!tr || R.takeover) return;
  detector.reset(); R.checking = null;
  const base = mt + 20;
  R.playing = { tr, base, wall: performance.now(), i: 0, si: 0 };
  R.sheet = null;
  if (tr.touchAt != null) R.playing.touchAt = base + tr.touchAt;
  renderRider();
}
function playTick(now) {
  const p = R.playing;
  const traceT = (now - p.wall) * SPEEDUP;
  const { samples, speeds } = p.tr;
  while (p.si < speeds.length && speeds[p.si].t <= traceT) { detector.speed(p.base + speeds[p.si].t, speeds[p.si].kmh); p.si++; }
  while (p.i < samples.length && samples[p.i].t <= traceT) {
    const s = samples[p.i];
    if (p.touchAt != null && p.base + s.t >= p.touchAt && !p.touched) { detector.touch(p.touchAt); p.touched = true; }
    feed({ t: p.base + s.t, g: s.g, rot: s.rot });
    mt = p.base + s.t;
    p.i++;
  }
  if (p.i >= samples.length) { R.playing = null; lastSpeedAt = mt; }
}

/* the model has decided */
function decided(d) {
  R.checking = null;
  R.last = d;
  R.checks.unshift({ at: new Date(), d });
  R.checks = R.checks.slice(0, 5);
  if (!R.set.on || R.takeover) { renderRider(); return; }
  if (d.verdict === "crash" && !R.takeover) return startAsk();
  if (d.verdict === "fall" && !R.takeover) { R.sheet = "fall"; beep([660, 880], 120, 0.12); buzz([120, 80, 120]); renderRider(); return; }
  toast(d.words);
  renderRider();
}

/* ----- Are you okay? ----- */
let askTimer = null;
function startAsk() {
  const total = R.set.stage ? 10 : R.set.wait;
  R.takeover = "ask";
  R.sheet = null;
  R.ask = { total, left: total, startedAt: performance.now() };
  renderRider();
  say("Are you okay? Tap I'm okay. If you do not answer, Ride Nanba will tell Amma and Arjun where you are.");
  clearInterval(askTimer);
  askTimer = setInterval(() => {
    const left = Math.max(0, R.ask.total - Math.floor((performance.now() - R.ask.startedAt) / 1000));
    if (left !== R.ask.left) {
      R.ask.left = left;
      beep(left <= 5 ? [988, 988] : [880, 660], 150, left <= 5 ? 0.24 : 0.16);
      buzz(left <= 5 ? [300] : [160]);
      updateRing();
    }
    if (left <= 0) { clearInterval(askTimer); sendAlert("no answer"); }
  }, 100);
}
function okay() {
  clearInterval(askTimer);
  const took = Math.round((performance.now() - R.ask.startedAt) / 1000);
  R.takeover = null; R.ask = null;
  addLog({ what: "Crash Check asked if you were okay", detail: `You answered in ${took} s. Nothing was shared.` });
  toast("Glad you are okay. Nothing was sent.");
  renderRider();
}
function sendAlert(why) {
  clearInterval(askTimer);
  const at = new Date();
  const until = new Date(at.getTime() + 60 * 60000);
  const where = R.gps && R.gps.lat ? { lat: R.gps.lat, lng: R.gps.lng, place: "Your location from GPS" } : { lat: 12.8925, lng: 80.0809, place: "GST Road, near Vandalur" };
  const f = R.last ? R.last.features : {};
  R.alert = { at: at.getTime(), until: until.getTime(), ...where, before: f.speedBefore != null ? Math.round(f.speedBefore) : null, why };
  R.takeover = "sent"; R.ask = null;
  R.people = R.people.map((p) => ({ ...p, status: p.id === "amma" ? "Sent" : "Sent by text message" }));
  addLog({ what: "Location sent to Amma and Arjun", detail: `${why === "asked" ? "You asked for help" : "You did not answer"} at ${time12(at)}. Shared until ${time12(until)}.` });
  send({ to: "guardian", type: "alert", alert: { ...R.alert, name: "Priya" } });
  say("Sending your location to Amma and Arjun.");
  renderRider();
}
function imSafe() {
  const at = new Date();
  send({ to: "guardian", type: "safe", at: at.getTime() });
  addLog({ what: "Location sharing stopped", detail: `You tapped I'm safe at ${time12(at)}.` });
  R.takeover = null; R.alert = null;
  R.people = R.people.map((p) => ({ ...p, status: "Not sent" }));
  R.moving = false;
  toast("Location sharing stopped. Amma and Arjun know you are safe.");
  renderRider();
}
function riderHear(msg) {
  if (msg.type === "seen" || msg.type === "going") {
    R.people = R.people.map((p) => (p.id === "amma" ? { ...p, status: msg.type === "going" ? "On her way" : `Seen at ${time12(new Date())}` } : p));
    if (msg.type === "going") { say("Amma is on her way."); beep([523, 659, 784], 140, 0.12); }
    if (R.takeover === "sent") renderRider();
  }
}
function addLog(e) {
  R.log.unshift({ at: Date.now(), ...e });
  R.log = R.log.slice(0, 8);
  store.set("log", R.log);
}

let toastTimer = null;
function toast(text, root = rider) {
  const st = root === rider ? R : A;
  st.toast = text;
  clearTimeout(st._tt);
  st._tt = setTimeout(() => { st.toast = null; const el = root.querySelector(".toast"); if (el) el.remove(); }, 3800);
  const old = root.querySelector(".toast"); if (old) old.remove();
  root.insertAdjacentHTML("beforeend", `<div class="toast" role="status">${esc(text)}</div>`);
}

      <button type="button" class="btn btn-primary" data-a="okay">I'm okay</button>
      <button type="button" class="btn btn-danger" data-a="help">Get help now</button>
    </div>
  </div>`;
}

function sentTakeover() {
  const a = R.alert;
  const people = R.people.map((p) => row({ ic: "users", title: `${p.name}`, sub: `${p.rel}`, trail: `<span class="tag ${/way|Seen/.test(p.status) ? "tag-ok" : "tag-neutral"}">${esc(p.status)}</span>` })).join("");
  return `<div class="takeover" role="dialog" aria-labelledby="sent-h">
    <div class="scroll"><div class="page-top" style="padding-bottom:16px">
      <span class="tag tag-flood"><span class="dot"></span>Sharing your location</span>
      <h1 class="h-28 mt-3" id="sent-h">Amma and Arjun know</h1>
      <p class="t-base muted mt-1 tn">Sent at ${time12(new Date(a.at))}. They can see where you are until ${time12(new Date(a.until))}, or until you tap I'm safe.</p>
      <div class="mt-4">${people}</div>
      <div class="mt-2">
        <div class="row"><span class="row-ic">${icon("phone")}</span><span class="row-body"><span class="row-title">Ambulance: 108</span><span class="row-sub">Call if you are hurt. Ride Nanba does not call for you.</span></span><a class="chip" style="display:grid;place-items:center;text-decoration:none" href="tel:108">Call</a></div>
        ${row({ ic: "pin", title: esc(a.place), sub: `Shared with 2 people until ${time12(new Date(a.until))}` })}
        ${row({ ic: "card", title: "Medical ID", sub: "Show your blood group and allergies to someone helping you", action: "medical" })}
      </div>
    </div></div>
    <div class="footer"><button type="button" class="btn btn-primary" data-a="safe">I'm safe, stop sharing</button></div>
  </div>`;
}

function presenterSheet() {
  const sensorLine = R.sensor === "on" ? (R.gps && R.gps.kmh != null && R.gps.kmh > 3 ? "Reading motion and GPS speed on this phone" : "Reading motion. Speed comes from the setting above.") : R.sensor === "none" ? "This browser is not sharing motion here. Open the page from its own web address on a phone, or use the moments below." : "Drop it on a pillow, or throw it onto a sofa and leave it";
  const moments = [["drop", "Drop from my hand"], ["pothole", "Pothole at 30 km/h"], ["crash", "Crash at 34 km/h"], ["mount", "Phone falls off the mount"], ["slip", "Slow skid, I get up"]]
    .map(([id, t]) => `<button type="button" class="chip" data-a="play" data-id="${id}">${t}</button>`).join("");
  const narrow = matchMedia("(max-width: 939px)").matches;
  return sheet("Presenter controls", `
    <h3 class="t-sm med">Priya is</h3>
    <div class="chips mt-2">
      <button type="button" class="chip" aria-pressed="${R.moving}" data-a="moving">Riding at 32 km/h</button>
      <button type="button" class="chip" aria-pressed="${!R.moving}" data-a="stopped">Stopped at a signal</button>
    </div>
    <h3 class="t-sm med mt-6">Act it out</h3>
    <div class="chips mt-2">${moments}</div>
    <div class="mt-4">
      ${R.sensor === "on" ? row({ ic: "activity", title: "Motion sensor is on", sub: sensorLine, trail: `<span class="tag tag-ok"><span class="dot"></span>Live</span>` }) : row({ ic: "phoneSm", title: "Use this phone's motion sensor", sub: sensorLine, action: "sensor" })}
      ${switchRow("Short countdown for the stage", "10 seconds instead of " + R.set.wait, R.set.stage, "t-stage")}
      ${narrow ? row({ ic: "users", title: "Make this Amma's phone", sub: room ? (R.peers ? `${R.peers} other phone${R.peers > 1 ? "s" : ""} on this page now` : "Open this page on a second phone and choose Amma") : "For a second phone in the same browser, open another tab", action: "role-guardian" }) : ""}
      ${row({ ic: "rotate", title: "Start over", sub: "Clear checks and what was shared", action: "reset" })}
    </div>
    <button type="button" class="btn btn-primary mt-4" data-a="close">Done</button>`);
}
function fallSheet() {
  return sheet("That looked like a fall", `
    <p class="t-base muted center">Crash Check saw a hit while you were riding, then you moved. Nothing has been sent.</p>
    <div class="stack gap-3 mt-6">
      <button type="button" class="btn btn-primary" data-a="fine">I'm fine</button>
      <button type="button" class="btn btn-soft" data-a="help">Tell Amma and Arjun</button>
    </div>`);
}
function medicalSheet() {
  return sheet("Medical ID", `
    <p class="t-sm muted center">On your lock screen only after a crash, for whoever helps you. You choose what is here.</p>
    <div class="medid mt-4">
      ${row({ title: "Priya, 19", sub: "Name and age" })}
      ${row({ title: "O positive", sub: "Blood group" })}
      ${row({ title: "Penicillin", sub: "Allergies" })}
      ${row({ title: "Amma, +91 98400 21136", sub: "Call first" })}
    </div>
    <p class="t-sm muted mt-3">Not shown: your address, your trips, your other contacts.</p>
    <button type="button" class="btn btn-primary mt-4" data-a="close">Done</button>`);
}
function sheet(title, body) {
  return `<div class="overlay" data-a="close"></div><div class="bsheet" role="dialog" aria-label="${esc(title)}"><span class="grab"></span><div class="scroll"><h2 class="sheet-title" style="margin-top:0">${esc(title)}</h2><div class="mt-4">${body}</div></div></div>`;
}

let savedScroll = 0;
function renderRider() {
  const sc = rider.querySelector(".scroll.main");
  if (sc) savedScroll = sc.scrollTop;
  const main = R.screen === "decides" ? decidesScreen() : R.screen === "settings" ? settingsScreen() : rideScreen();
  let over = "";
  if (R.takeover === "ask") over += askTakeover();
  if (R.takeover === "sent") over += sentTakeover();
  if (R.sheet === "presenter") over += presenterSheet();
  if (R.sheet === "fall") over += fallSheet();
  if (R.sheet === "medical") over += medicalSheet();
  rider.innerHTML = `<div class="scroll main">${main}</div>${over}${R.toast ? `<div class="toast" role="status">${esc(R.toast)}</div>` : ""}`;
  const sc2 = rider.querySelector(".scroll.main");
  if (sc2 && R._keepScroll) sc2.scrollTop = savedScroll;
  R._keepScroll = false;
  if (R.takeover === "ask") updateRing();
  updateLive(true);
}
function updateRing() {
  const arc = rider.querySelector("#ring-arc"); const n = rider.querySelector("#ring-n");
  if (!arc || !R.ask) return;
  n.textContent = R.ask.left;
  arc.setAttribute("stroke-dashoffset", String(603.2 * (1 - R.ask.left / R.ask.total)));
}

rider.addEventListener("click", (e) => {
  const b = e.target.closest("[data-a]");
  if (!b) return;
  detector.touch(mt);
  const a = b.dataset.a;
  const go = (scr) => { R.screen = scr; R.sheet = null; renderRider(); const sc = rider.querySelector(".scroll.main"); if (sc) sc.scrollTop = 0; };
  switch (a) {
    case "presenter": R.sheet = "presenter"; return renderRider();
    case "close": R.sheet = null; return renderRider();
    case "decides": return go("decides");
    case "settings": return go("settings");
    case "back": return go(R.screen === "settings" ? "decides" : "ride");
    case "moving": R.moving = true; R._keepScroll = true; return renderRider();
    case "stopped": R.moving = false; R._keepScroll = true; return renderRider();
    case "play": R._keepScroll = true; return play(b.dataset.id);
    case "sensor": return startSensor();
    case "okay": return okay();
    case "help": R.sheet = null; return sendAlert("asked");
    case "fine": R.sheet = null; addLog({ what: "Crash Check saw a fall", detail: "You said you were fine. Nothing was shared." }); toast("Okay. Nothing was sent."); return renderRider();
    case "safe": return imSafe();
    case "medical": R.sheet = "medical"; return renderRider();
    case "wait": R.set.wait = Number(b.dataset.w); store.set("settings", R.set); R._keepScroll = true; return renderRider();
    case "t-on": R.set.on = !R.set.on; store.set("settings", R.set); R._keepScroll = true; return renderRider();
    case "t-trips": R.set.tripsOnly = !R.set.tripsOnly; store.set("settings", R.set); R._keepScroll = true; return renderRider();
    case "t-stage": R.set.stage = !R.set.stage; store.set("settings", R.set); return renderRider();
    case "clearlog": R.log = []; store.set("log", []); R._keepScroll = true; return renderRider();
    case "role-guardian": return setRole("guardian");
    case "reset":
      R.log = []; store.set("log", []); R.checks = []; R.last = null; R.sheet = null; R.moving = true; R.progress = 0.34;
      detector.reset(); return renderRider();
    default: return;
  }
});

/* live bits, without re-rendering: g readout, the rider dot, the chart */
function updateLive(force) {
  const gv = rider.querySelector("#cc-gv");
  if (gv) {
    gv.textContent = lastG.toFixed(1) + " g";
    const rowEl = rider.querySelector("#cc-row");
    const bar = rider.querySelector("#cc-bar");
    const checking = R.checking != null;
    rowEl.classList.toggle("checking", checking);
    rider.querySelector("#cc-title").textContent = !R.set.on ? "Crash Check is off" : checking ? "Something happened. Checking." : R.playing ? "Crash Check is on" : "Crash Check is on";
    rider.querySelector("#cc-sub").textContent = !R.set.on ? "Turn it on in Crash Check settings" : checking ? "Watching how you move for 6 seconds" : R.sensor === "on" ? "Reading this phone's motion. Nothing leaves it." : "Watching for a crash. Nothing leaves your phone.";
    bar.hidden = !checking;
    if (checking) bar.firstElementChild.style.width = Math.min(100, ((mt - R.checking) / M.T.settleMs) * 100) + "%";
  }
  const me = rider.querySelector("#rm-me");
  const path = rider.querySelector("#rm-route");
  if (me && path) {
    const p = path.getPointAtLength(path.getTotalLength() * R.progress);
    me.setAttribute("transform", `translate(${p.x} ${p.y})`);
  }
  const cg = rider.querySelector("#chart-g");
  if (cg) cg.textContent = lastG.toFixed(1) + " g";
  drawChart();
}
function drawChart() {
  const c = rider.querySelector("#chart");
  if (!c) return;
  const ctx = c.getContext("2d");
  const W = c.width, H = c.height, padL = 54, padB = 8, padT = 10;
  const css = getComputedStyle(document.documentElement);
  const col = (n) => css.getPropertyValue(n).trim();
  ctx.clearRect(0, 0, W, H);
  const maxG = 8;
  const y = (g) => padT + (H - padT - padB) * (1 - Math.min(g, maxG) / maxG);
  ctx.font = "22px system-ui, -apple-system, sans-serif";
  ctx.textBaseline = "middle";
  for (const g of [0, 1, 2.5, 5, 8]) {
    ctx.strokeStyle = g === 2.5 ? col("--flood") : col("--surface-2");
    ctx.setLineDash(g === 2.5 ? [8, 8] : []);
    ctx.lineWidth = g === 2.5 ? 2 : 1.5;
    ctx.beginPath(); ctx.moveTo(padL, y(g)); ctx.lineTo(W, y(g)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = g === 2.5 ? col("--flood") : col("--muted");
    if (g) ctx.fillText((g === 2.5 ? "2.5" : String(g)) + " g", 0, Math.min(H - 12, Math.max(12, y(g))));
  }
  if (!trace.length) return;
  const t1 = trace[trace.length - 1].t, t0 = t1 - 10000;
  const x = (t) => padL + ((t - t0) / 10000) * (W - padL);
  if (R.checking != null && R.checking > t0) {
    ctx.fillStyle = col("--surface-2");
    ctx.fillRect(x(R.checking), padT, Math.max(2, x(Math.min(t1, R.checking + M.T.settleMs)) - x(R.checking)), H - padT - padB);
  }
  ctx.strokeStyle = col("--text"); ctx.lineWidth = 3; ctx.lineJoin = "round";
  ctx.beginPath();
  trace.forEach((s, i) => (i ? ctx.lineTo(x(s.t), y(s.g)) : ctx.moveTo(x(s.t), y(s.g))));
  ctx.stroke();
  const end = trace[trace.length - 1];
  ctx.fillStyle = col("--text");
  ctx.beginPath(); ctx.arc(x(end.t), y(end.g), 6, 0, Math.PI * 2); ctx.fill();
}
let lastScreenSig = "";
(function frame() {
  updateLive();
  // re-render the decides page when a playback ends or a new check lands, so its table and caption are current
  const sig = `${R.screen}|${!!R.playing}|${R.last ? R.last.at : 0}|${R.moving}`;
  if (sig !== lastScreenSig) { const changed = lastScreenSig !== ""; lastScreenSig = sig; if (changed && !R.takeover && R.screen !== "settings") { R._keepScroll = true; renderRider(); } }
  requestAnimationFrame(frame);
})();

/* ================= GUARDIAN: Amma ================= */
const A = { screen: "idle", alert: null, going: false, safeAt: null, toast: null };
const guardian = document.getElementById("guardian");
let ringTimer = null;

function guardianHear(msg) {
  if (msg.type === "alert") {
    A.screen = "alert"; A.alert = msg.alert; A.going = false;
    renderGuardian();
    clearInterval(ringTimer);
    let n = 0;
    ringTimer = setInterval(() => { beep([740, 988, 740], 140, 0.2); buzz([400, 200, 400]); if (++n >= 6) clearInterval(ringTimer); }, 1500);
    setTimeout(() => send({ to: "rider", type: "seen", by: "amma" }), 1500);
  }
  if (msg.type === "safe") {
    clearInterval(ringTimer);
    A.screen = "safe"; A.safeAt = msg.at; A.alert = null;
    renderGuardian();
  }
}
function guardianIdle() {
  return `<div class="page-top" style="padding-bottom:32px">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="flex:1;min-width:0"><h1 class="h-28">Priya</h1><p class="t-base muted mt-1">On a Ride Nanba trip to Chennai Central</p></div>
      <div class="avatar">P</div>
    </div>
    <div class="mt-4">
      ${row({ artName: "shield", title: "Crash Check is on for this trip", sub: "You hear from it only if Priya needs help" })}
      ${row({ ic: "eyeoff", title: "You cannot see where she is", sub: "Her location comes to you only after a crash she does not answer" })}
      ${row({ ic: "clock", title: `Trip started ${time12(R.startedAt)}`, sub: "Scooter to Tambaram, then the train" })}
    </div>
    <div class="tile mt-4 stack gap-3">
      <h3 class="t-sm med">If Priya crashes and does not answer</h3>
      <div style="display:flex;gap:12px">${icon("activity")}<span class="t-sm">This phone rings, even on silent</span></div>
      <div style="display:flex;gap:12px">${icon("pin")}<span class="t-sm">You see where she is for one hour</span></div>
      <div style="display:flex;gap:12px">${icon("gauge")}<span class="t-sm">You see how fast she was going, and whether she has moved since</span></div>
    </div>
    <p class="t-sm muted mt-4">Priya added you on 2 Oct. You can leave her circle at any time.</p>
    ${matchMedia("(max-width: 939px)").matches ? `<button type="button" class="link t-sm mt-4" data-a="role-rider">Make this Priya's phone</button>` : ""}
  </div>`;
}
function guardianAlert() {
  const a = A.alert;
  const when = time12(new Date(a.at));
  const maps = `https://www.google.com/maps?q=${a.lat},${a.lng}`;
  return `<div class="mapscreen">
    <div class="mapbox" style="height:250px">${mapSvg("gm", when)}</div>
    <section class="sheet-body">
      <span class="grab" aria-hidden="true"></span>
      <div class="page-top" style="padding-top:16px">
        <span class="tag tag-flood"><span class="dot"></span>Possible crash</span>
        <h1 class="h-28 mt-2">Priya may have crashed</h1>
        <p class="t-base muted mt-1 tn">${a.why === "asked" ? "She asked for help" : "She did not answer Crash Check"} at ${when}.</p>
        <div class="mt-2">
          ${row({ ic: "pin", title: esc(a.place), sub: `Shared with you until ${time12(new Date(a.until))}`, trail: `<a class="link t-sm" href="${maps}" target="_blank" rel="noopener">Open in Maps</a>` })}
          ${row({ ic: "gauge", title: a.before != null ? `${a.before} km/h, then stopped` : "Stopped suddenly", sub: "Her phone has not moved since" })}
        </div>
      </div>
    </section>
    <div class="footer stack gap-3">
      <a class="btn btn-primary" style="text-decoration:none" href="tel:+919840021136">${icon("phone")}Call Priya</a>
      <div class="btn-row">
        <a class="btn btn-soft" style="text-decoration:none" href="tel:108">Call 108</a>
        <button type="button" class="btn btn-soft" data-a="going" ${A.going ? "disabled" : ""}>${A.going ? "She knows" : "I'm going"}</button>
      </div>
    </div>
  </div>`;
}
function guardianSafe() {
  return `<div class="page-top center" style="padding-top:max(env(safe-area-inset-top,0px),64px)">
    ${art("shield", 112)}
    <h1 class="h-28 mt-4">Priya is safe</h1>
    <p class="t-base muted mt-2 tn">She tapped I'm safe at ${time12(new Date(A.safeAt))}. Her location is no longer shared with you.</p>
    <div class="pad mt-8"><button type="button" class="btn btn-primary" data-a="g-done">Done</button></div>
  </div>`;
}
function renderGuardian() {
  const main = A.screen === "alert" ? guardianAlert() : A.screen === "safe" ? guardianSafe() : guardianIdle();
  guardian.innerHTML = `<div class="scroll main">${main}</div>`;
}
guardian.addEventListener("click", (e) => {
  const b = e.target.closest("[data-a]");
  if (!b) return;
  clearInterval(ringTimer);
  const a = b.dataset.a;
  if (a === "going") { A.going = true; send({ to: "rider", type: "going", by: "amma" }); toast("Priya can see you are on your way.", guardian); renderGuardian(); }
  if (a === "g-done") { A.screen = "idle"; renderGuardian(); }
  if (a === "role-rider") setRole("rider");
});

/* ================= which phone is this? ================= */
const stage = document.getElementById("stage");
function setRole(role) {
  stage.dataset.only = role;
  store.set("role", role);
  if (room) room.presence({ role }).catch(() => {});
  R.sheet = null;
  renderRider(); renderGuardian();
}
const saved = store.get("role", null);
const hash = (location.hash || "").replace("#", "");
stage.dataset.only = hash === "amma" ? "guardian" : hash === "priya" ? "rider" : saved || "rider";

renderRider();
renderGuardian();
})();
</script>
